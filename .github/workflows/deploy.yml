name: Deploy
run-name: "Deploy (${{ inputs.ref }})"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: false
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Build
        uses: ./.github/actions/build
        with:
          lint: 'false'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # Create the key file already private (umask 077) rather than writing
          # it world-readable and chmod'ing afterwards, which leaves a brief
          # 0644 window.
          (umask 077; echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519)
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -crvz --delete ./dist/ ${{ secrets.DEPLOY_URL }}

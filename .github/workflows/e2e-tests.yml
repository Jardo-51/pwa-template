name: E2E Tests

# Separate from Build on purpose: Build gates every push and stays fast, while
# this one makes a production build and drives it in a browser. Pull requests
# and main only — running it on every WIP commit is not worth the minutes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Nix + the pnpm store cache, shared with the Build workflow. This one
      # does not use `.github/actions/build` itself: it wants the Nix store
      # cache below in between, and the `pnpm build` that action ends with is
      # redundant here — playwright's `webServer` builds the app anyway.
      - name: Set up toolchain
        uses: ./.github/actions/setup

      # The browsers come from the playwright shell, so the whole store is
      # worth keeping between runs. Keyed on the flake, which is what decides
      # what is in it. This is the opposite call from the one recorded in
      # `.github/actions/setup`, where caching the store cost more than it
      # saved — that is about the default shell, and it is the browser closure
      # here, far larger than `nodejs` + `pnpm`, that flips the tradeoff.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-playwright-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-playwright-${{ runner.os }}-

      - name: Install
        run: nix develop --command bash -c "pnpm install --frozen-lockfile"

      # Before the suite rather than after it, so that when the two halves of
      # the pin have drifted the log leads with which ones and how to fix it,
      # instead of with a browser launch failing on "Executable doesn't exist"
      # — a message that names neither the pin nor the flake.
      - name: Check the Playwright pin
        run: nix develop --command bash -c "pnpm check:playwright-pin"

      # Through the playwright shell, the same way the tests are run locally:
      # it brings the browsers with it, pinned alongside the @playwright/test
      # version, so CI and a dev machine drive the identical binary. Installing
      # them here instead (`playwright install`) hangs until the step times out.
      - name: Test
        run: nix develop .#playwright --command bash -c "pnpm test:e2e"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

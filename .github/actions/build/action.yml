name: Build app
description: Install Nix + pnpm, restore the pnpm store cache, and build the app.

inputs:
  lint:
    description: Run `pnpm lint` before building.
    default: 'true'
  github_access_token:
    description: Passed straight through to `.github/actions/setup`.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up toolchain
      uses: ./.github/actions/setup
      with:
        github_access_token: ${{ inputs.github_access_token }}

    - name: Build
      shell: bash
      # Pass the input through env and branch in shell rather than splicing the
      # expression result into the script text.
      env:
        RUN_LINT: ${{ inputs.lint }}
      run: |
        nix develop --command bash -c '
          set -e
          pnpm install --frozen-lockfile
          if [ "$RUN_LINT" = true ]; then pnpm lint; fi
          pnpm build
        '
